# Creates a GitHub release when a version tag is pushed, with notes GitHub
# generates itself.
#
# Separate from publish-docker-image.yaml on purpose: that one also runs on
# main, and a release is a tag-only event. Keeping them apart means a failed
# release cannot stop an image being published, or the reverse.
#
# Note what GitHub's generated notes are built from: **merged pull requests**
# since the previous tag, plus new contributors. A history of commits pushed
# straight to main produces notes containing little more than the compare link.
# .github/release.yml configures how they are grouped for when there are pull
# requests to group.
#
# The release carries, per architecture, a Linux binary and an RPM. The binaries
# are archives rather than bare files for two reasons: 20 MB of static Go binary
# compresses to about 7 MB, and the AGPL wants its terms distributed with the
# thing it covers, so LICENSE and README.md ride along inside.
#
# The RPMs are built in a CentOS Stream container from the same cross-compiled
# binaries. Nothing is compiled inside the container, which is why one x86_64
# runner produces both packages -- see .rpm/build-rpm.sh.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # Creating a release is a write to the repository. Nothing else is needed --
  # the image is published by its own workflow with its own narrower token.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # CGO_ENABLED=0 because modernc.org/sqlite is pure Go, so these are
      # static binaries with no libc to match -- the same reason the container
      # image can be distroless. Cross-compiled rather than emulated, so arm64
      # costs no more than amd64.
      #
      # The version stamped in is the tag without its leading v, matching what
      # docker/metadata-action puts on the image, so an image and a binary from
      # the same tag report the same string from GET /api/health.
      - name: Build the binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-w -s -X caravel/internal/buildinfo.Version=$version" \
              -o "build/caravel-linux-${arch}" ./cmd/caravel
            stage="$(mktemp -d)"
            cp "build/caravel-linux-${arch}" "$stage/caravel"
            cp LICENSE README.md "$stage/"
            tar -czf "dist/caravel-${version}-linux-${arch}.tar.gz" \
              -C "$stage" caravel LICENSE README.md
            rm -rf "$stage"
          done

      # The bare binaries from the step above are what go into the packages, so
      # a released RPM and a released archive contain the identical build.
      - name: Build the RPMs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Go's architecture names on the left, RPM's on the right.
          for pair in amd64:x86_64 arm64:aarch64; do
            goarch="${pair%%:*}"
            rpmarch="${pair##*:}"
            docker run --rm -v "$PWD":/rpmbuild \
              quay.io/centos/centos:stream10 \
              /rpmbuild/.rpm/build-rpm.sh \
              "build/caravel-linux-${goarch}" "$version" "$rpmarch"
          done
          # build-rpm.sh drops them at the repository root.
          mv caravel-*.rpm dist/

      - name: Collect checksums
        run: |
          set -euo pipefail
          # Bare filenames, not ./-prefixed: somebody who downloads the assets
          # and SHA256SUMS into one directory runs `sha256sum -c SHA256SUMS`
          # there, and the names have to match what they have.
          ( cd dist && sha256sum caravel-* > SHA256SUMS )
          ls -l dist
          file dist/caravel-*

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # A release whose assets silently failed to attach looks finished and
          # is not.
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag with a suffix -- v1.0.0-rc1, v2.0.0-beta2 -- is a prerelease,
          # so it does not become the "Latest" release people land on. Plain
          # v1.0.0 does.
          prerelease: ${{ contains(github.ref_name, '-') }}
