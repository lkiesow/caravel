# Publishes the container image to GitHub's registry.
#
# Modelled on lkiesow/audiobook-notifier's workflow of the same name, with three
# differences, each for a reason:
#
#   - Triggers are narrower. That workflow builds on every push; this one builds
#     on main, on version tags and on request. A branch push producing a
#     `:latest`-adjacent image is a way to publish something nobody reviewed.
#   - Two architectures. A self-hosted trip planner's natural home is a small ARM
#     box, so amd64 alone would exclude the obvious deployment.
#   - The VERSION build argument. The image reports its own build via
#     GET /api/health, and .git is not in the build context (see .dockerignore),
#     so the version has to be passed in or the binary calls itself "unknown".
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # So an image can be rebuilt without an empty commit - after a base image
  # updates, for instance.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Read the repository, write the package. Nothing else: the default token
      # is broader than this job needs.
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Only needed for the runtime layer of a foreign architecture: the
      # Dockerfile cross-compiles (see --platform=$BUILDPLATFORM there) rather
      # than emulating the Go build, which would take minutes per architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io/lkiesow/caravel — the same image both compose files name.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # Layer cache in the Actions cache, so an unchanged go.mod does not
          # re-download the module cache on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
