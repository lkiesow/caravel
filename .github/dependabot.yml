# Dependabot version updates, for the dependencies that otherwise go stale
# silently because nothing else bumps them. All monthly: each bump is reviewed
# by hand.
version: 2
updates:
  # The documentation site's Python pin (requirements.txt, next to this file).
  # Its header has the checklist for reviewing a bump.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: monthly
    commit-message:
      prefix: docs

  # The actions used by .github/workflows/. They are referenced by major tag
  # (actions/checkout@v7), so this only proposes new major versions -- the ones
  # that can change inputs or defaults, so read the release notes. Grouped
  # into one pull request. Its CI run exercises only ci.yml's actions: the
  # Pages ones in docs.yml run on a push to main, the release.yml ones on a
  # tag, so check those against their release notes before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # The Go modules in go.mod. Before this they moved only when a feature
  # happened to need a newer one, and goldmark -- which renders user-written
  # Markdown -- had fallen four years behind. Grouped into one pull request,
  # whose CI run is the full suite: the Go tests on SQLite and on Postgres, and
  # the UI suite on the bundle esbuild builds. A bump of evanw/esbuild changes
  # that bundle, so TestRealTreeBundles has to stay warning-free. Not covered:
  # the go directive in go.mod and the Go version in the workflows and the
  # Dockerfile, which are moved by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      go:
        patterns:
          - "*"

  # The UI test suite's only dependency, @playwright/test (package.json). Dev
  # tooling, never shipped, and the ui job in ci.yml runs it in full. A new
  # Playwright brings new browser builds, which can move layout assertions,
  # the contrast check and the output of make screenshots.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: test
