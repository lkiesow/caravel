name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because check_migrations.py compares the migration
      # directory against origin/main to prove no migration was removed or
      # renamed. In the default shallow clone there is no base commit, the
      # script says so and skips that check -- which would leave the squash
      # guard silently not running, the exact failure mode this stage is about.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: JS syntax check
        run: scripts/check_js.sh

      - name: i18n key parity
        run: python3 scripts/check_i18n.py

      # Both of these run in `make ci` and were missing here, so neither could
      # fail a pull request: check_env_vars has been able to catch a config
      # variable documented but not read since Stage 18 Milestone 4 and never
      # once run in CI.
      - name: Env var parity
        run: python3 scripts/check_env_vars.py

      - name: Screenshot references
        run: python3 scripts/check_screenshots.py

      - name: Migration chain
        run: python3 scripts/check_migrations.py

      - name: Test
        run: go test ./...

  # The documentation site, built the way the deploy workflow builds it.
  #
  # Its own job, and on pull requests too, so a dead link or a nav entry
  # pointing at a file that was renamed fails the change that caused it rather
  # than the deploy that follows it. Strict mode is what makes that a failure
  # instead of a warning. It installs from the same requirements.txt as
  # .github/workflows/docs.yml, so the build that gates a PR -- including a
  # Dependabot bump of the pin -- is the build that publishes.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Build the site
        run: zensical build --clean --strict

  # The same Go tests, against Postgres instead of SQLite.
  #
  # Its own job for the same reason as `ui` below: a database service is more
  # ways to fail than the fast `ci` job should carry, and a broken container
  # must not be able to mask a Go regression.
  #
  # Why it exists at all: sqlc emits both dialects and internal/db has a
  # hand-written adapter for each, but until Stage 18 nothing ever executed the
  # Postgres one — so a query change was verified there only by compiling. The
  # first run of this found ListItemsByTrip broken outright on Postgres (an
  # untyped sqlc.narg parameter, refused at prepare time) and a migrator that
  # leaked a connection per database.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Keep this in step with docker-compose.postgres.yml, which serves the
        # same purpose locally. The two are separate because Actions wants a
        # service container and a developer wants `make test-postgres`.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caravel
          POSTGRES_PASSWORD: caravel
          POSTGRES_DB: caravel
        ports:
          - 5432:5432
        # Without this the job races the database: Postgres restarts itself once
        # during first-time initialisation, so "the container exists" is not
        # "the server is accepting connections".
        options: >-
          --health-cmd "pg_isready -U caravel -d caravel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      CARAVEL_TEST_DB_DRIVER: postgres
      CARAVEL_TEST_DB_DSN: postgres://caravel:caravel@localhost:5432/caravel?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # internal/dbtest fails rather than falling back when the driver is set
      # and the server is unreachable, so a broken DSN cannot turn this job into
      # a green SQLite run. That covers the dangerous direction; this step
      # covers the embarrassing one, where the env block above is dropped in an
      # edit and the job silently tests SQLite twice.
      #
      # TestMigrationsDoNotHoldAConnection skips itself unless the driver is
      # postgres, so "did it skip?" answers "was this really Postgres?" — the
      # same shape as the assistant-capability check in the `ui` job.
      - name: Confirm the tests are really running against Postgres
        run: |
          set -euo pipefail
          out=$(go test -count=1 -v -run TestMigrationsDoNotHoldAConnection ./internal/db/)
          echo "$out"
          if echo "$out" | grep -q "SKIP"; then
            echo "::error::the Postgres-only test skipped, so this job is not testing Postgres" >&2
            exit 1
          fi
          echo "confirmed: the Postgres-only test ran"

      - name: Test
        run: go test -count=1 ./...

  # Separate job on purpose: this one installs a browser and starts a server, so
  # it is slower and has more ways to fail. Keeping it apart means a flaky browser
  # download can't mask a Go regression in the fast `ci` job above.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dev dependencies
        run: npm ci

      # Firefox runs the suite; Chromium runs the gesture specs alone, because
      # Playwright's isMobile — real touch and (pointer: coarse) — is
      # Chromium-only. WebKit is still not downloaded: nothing asks for it.
      - name: Install the browsers Playwright needs
        run: npx playwright install --with-deps firefox chromium

      # A runner has no GPU, and Firefox -- unlike Chromium, which carries
      # SwiftShader -- has no software renderer of its own. MapLibre v6 requires
      # a WebGL2 context, so without this every route mounting a <map-view>
      # waits 15s for data-ready and fails: 121 tests of 291, for five weeks,
      # while the three chromium-gestures specs rendering the same map passed
      # throughout and made it look like a Firefox bug rather than a missing
      # rasteriser (Stage 40).
      #
      # Mesa's llvmpipe is that renderer. `--with-deps` above installs what
      # Firefox needs to start, which is not the same set: this is explicit
      # because the failure it prevents is silent and expensive. The matching
      # about-face on the browser side -- Firefox blocklists an unrecognised
      # renderer and has to be told not to -- is SOFTWARE_GL_PREFS in
      # playwright.config.js, keyed off CI. Neither half works alone.
      # fonts-dejavu-core is not decoration: tests/ui/fonts.conf pins the suite
      # to DejaVu Sans so that layout assertions measure the same font here and
      # on a developer's machine, and fontconfig falls back *silently* when a
      # family is missing -- so without the package the pin would look applied
      # and quietly do nothing. capabilities.setup.js fails the run if that
      # happens rather than letting it pass on the wrong font.
      - name: Install a software OpenGL renderer, an X server and the test font
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb fonts-dejavu-core

      # No server is started here: `make test-ui` goes through
      # scripts/ui_test.sh, which brings up a throwaway instance of its own --
      # own port, own database, own uploads, own seed -- and tears it down
      # afterwards. The assistant env vars and the "is the assistant actually
      # enabled" check that used to live in this job moved into that script, so
      # they guard a developer's run too.
      # LIBGL_ALWAYS_SOFTWARE routes GL to llvmpipe rather than to a card that
      # is not there, and xvfb-run gives it somewhere to draw.
      #
      # The X server is not optional and was the part Stage 40 Milestone 3 got
      # wrong on its first attempt: headless Firefox on Linux still reaches its
      # GL context through GLX, so with no DISPLAY it gets none at all, whatever
      # Mesa is installed and whatever the prefs say. That run reported
      # `WebGL2 renderer: none` with libgl1-mesa-dri 25.2.8 present. Chromium
      # never needed this because SwiftShader is in-process, which is exactly
      # why its gesture specs passed throughout the five weeks the Firefox
      # projects were failing.
      #
      # Headless stays on: the display is for GLX to bind to, not for anybody to
      # look at. `-a` picks a free display number rather than assuming :99 is
      # free.
      #
      # On both steps, not just the suite: check-contrast launches its own
      # Firefox and drives the same routes.
      - name: UI suite
        run: xvfb-run -a make test-ui
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      # Contrast was measurable for four stages and asserted by nobody, so a
      # regression like Stage 07's 2.54:1 primary button would only be found by
      # someone thinking to look. Its own step rather than part of the suite:
      # it is a script, not a spec, and a failure here should read as "the
      # palette moved" rather than as a broken test.
      - name: Colour contrast
        run: xvfb-run -a make check-contrast
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      # The report is the only way to see what a headless failure looked like.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
