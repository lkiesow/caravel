<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The font the UI suite measures against, stated rather than inherited.

  web/css/base.css sets `font-family: system-ui` on body, and system-ui is
  whatever the operating system happens to offer. Firefox resolves it through
  fontconfig, so it is Noto Sans on the developer's Fedora box and DejaVu Sans
  on a GitHub runner — and routes.spec.js asserts things fonts decide: whether
  a control clears the 44px tap target, whether a row fits in 324px.

  Those two assertions therefore passed locally and failed on CI, which is a
  large part of why the ui job was red (Stage 40 Milestone 4). The label they
  caught was 44.0px on Noto Sans and 38px on DejaVu — not because the text
  wrapped differently, but because the two fonts have different default line
  boxes. It cleared the guideline by nothing at all and nobody knew.

  So the suite pins one font on every machine. DejaVu Sans deliberately:

    - it is the narrower, shorter-line-box case, which is the adversarial one
      — the same reason routes.spec.js sweeps German and not just English,
      "the longer of the two languages, so it is the case most likely to
      overflow";
    - it ships on both Fedora and Ubuntu, so a developer and the runner get the
      same answer without anybody installing anything unusual;
    - and it is what the CI failures were already measuring, so a fix verified
      locally is a fix verified against the thing that actually failed.

  This is NOT a claim about what users see. Production keeps system-ui on
  purpose: native look, no download, and it respects the reader's own font
  settings. The point of pinning here is that the *test* should be reproducible
  and should lean on the harder case, not that everyone should get DejaVu.

  Wired up in scripts/with_server.sh via FONTCONFIG_FILE, so `make test-ui` and
  `make check-contrast` both get it. tests/ui/capabilities.setup.js asserts it
  actually took — fontconfig falls back silently when a family is missing, and
  a pin that quietly did nothing would put us straight back where we started.
-->
<fontconfig>
  <!-- Keep the system configuration: this adds a preference, it does not
       replace the font directories, the cache paths or the rendering defaults.
       ignore_missing because the path differs across distributions and an
       absent one should weaken this file, not break the run. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Both families, because they are separate lookups: `system-ui` is what
       base.css asks for, and `sans-serif` is what it falls back to (and what
       Firefox consults when it resolves system-ui without a desktop
       environment to ask, which is the case under xvfb-run on CI). -->
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
