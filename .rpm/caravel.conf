# Caravel configuration, read by the systemd unit as an EnvironmentFile. A
# change here needs `systemctl restart caravel`.
#
# Every setting has a working default; the two below are set because the
# packaged defaults differ from the built-in ones, which are relative paths
# suited to running from a checkout.
#
# Full reference: https://lkiesow.github.io/caravel/configuration/server/

CARAVEL_PORT=8080

CARAVEL_DB_DSN=/var/lib/caravel/caravel.db
CARAVEL_UPLOAD_DIR=/var/lib/caravel/uploads

# Postgres instead of SQLite. There is no migration path between the two, so
# choose before putting real trips in it.
#CARAVEL_DB_DRIVER=postgres
#CARAVEL_DB_DSN=postgres://caravel:password@localhost:5432/caravel?sslmode=disable

# The optional AI assistant, off unless CARAVEL_LLM_URL is set. Secrets belong
# here rather than in the unit file: this file is 0640 and readable only by the
# service user, while a unit file is world-readable.
#CARAVEL_LLM_URL=
#CARAVEL_LLM_MODEL=
#CARAVEL_LLM_KEY=

# Address search. Defaults to OpenStreetMap's Nominatim; set it empty to switch
# address search off entirely.
#CARAVEL_GEOCODER_URL=
