name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: JS syntax check
        run: scripts/check_js.sh

      - name: i18n key parity
        run: python3 scripts/check_i18n.py

      - name: Test
        run: go test ./...

  # The documentation site, built the way the deploy workflow builds it.
  #
  # Its own job, and on pull requests too, so a dead link or a nav entry
  # pointing at a file that was renamed fails the change that caused it rather
  # than the deploy that follows it. Strict mode is what makes that a failure
  # instead of a warning. The version is pinned to the same 0.0.x as
  # .github/workflows/docs.yml -- if you bump one, bump both, or the build that
  # gates a PR is not the build that publishes.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install zensical==0.0.57

      - name: Build the site
        run: zensical build --clean --strict

  # The same Go tests, against Postgres instead of SQLite.
  #
  # Its own job for the same reason as `ui` below: a database service is more
  # ways to fail than the fast `ci` job should carry, and a broken container
  # must not be able to mask a Go regression.
  #
  # Why it exists at all: sqlc emits both dialects and internal/db has a
  # hand-written adapter for each, but until Stage 18 nothing ever executed the
  # Postgres one — so a query change was verified there only by compiling. The
  # first run of this found ListItemsByTrip broken outright on Postgres (an
  # untyped sqlc.narg parameter, refused at prepare time) and a migrator that
  # leaked a connection per database.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Keep this in step with docker-compose.postgres.yml, which serves the
        # same purpose locally. The two are separate because Actions wants a
        # service container and a developer wants `make test-postgres`.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caravel
          POSTGRES_PASSWORD: caravel
          POSTGRES_DB: caravel
        ports:
          - 5432:5432
        # Without this the job races the database: Postgres restarts itself once
        # during first-time initialisation, so "the container exists" is not
        # "the server is accepting connections".
        options: >-
          --health-cmd "pg_isready -U caravel -d caravel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      CARAVEL_TEST_DB_DRIVER: postgres
      CARAVEL_TEST_DB_DSN: postgres://caravel:caravel@localhost:5432/caravel?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # internal/dbtest fails rather than falling back when the driver is set
      # and the server is unreachable, so a broken DSN cannot turn this job into
      # a green SQLite run. That covers the dangerous direction; this step
      # covers the embarrassing one, where the env block above is dropped in an
      # edit and the job silently tests SQLite twice.
      #
      # TestMigrationsDoNotHoldAConnection skips itself unless the driver is
      # postgres, so "did it skip?" answers "was this really Postgres?" — the
      # same shape as the assistant-capability check in the `ui` job.
      - name: Confirm the tests are really running against Postgres
        run: |
          set -euo pipefail
          out=$(go test -count=1 -v -run TestMigrationsDoNotHoldAConnection ./internal/db/)
          echo "$out"
          if echo "$out" | grep -q "SKIP"; then
            echo "::error::the Postgres-only test skipped, so this job is not testing Postgres" >&2
            exit 1
          fi
          echo "confirmed: the Postgres-only test ran"

      - name: Test
        run: go test -count=1 ./...

  # Separate job on purpose: this one installs a browser and starts a server, so
  # it is slower and has more ways to fail. Keeping it apart means a flaky browser
  # download can't mask a Go regression in the fast `ci` job above.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dev dependencies
        run: npm ci

      # Only Firefox: the suite runs one project, and downloading the other
      # engines would triple this step for nothing.
      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox

      - name: Start the server and seed the scenarios
        env:
          CARAVEL_DB_DSN: data/ci.db
          CARAVEL_WEB_DIR: web
          # The assistant, pointed at its in-process fakes. This is the first
          # thing the UI suite needs from server *configuration* rather than
          # from seed data, so assist.spec.js skips rather than fails when it
          # is absent - which is what a developer running `make test-ui`
          # against an ordinary dev server gets. Here it must be present, or
          # the spec would skip silently and CI would report a pass for tests
          # that never ran.
          CARAVEL_LLM_URL: stub
          CARAVEL_LLM_MODEL: stub
          CARAVEL_SEARCH_PROVIDER: stub
        run: |
          set -euo pipefail
          mkdir -p data
          # Seed first: db.Open() runs the migrations, so this builds the schema
          # and creates the demo users the suite logs in as.
          go run ./cmd/seed
          # Build rather than `go run` so the background process is the server
          # itself, not a wrapper that compiles first.
          go build -o /tmp/caravel-ci ./cmd/caravel
          nohup /tmp/caravel-ci > /tmp/caravel-ci.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/api/health; then
              echo "server healthy after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "server did not become healthy within 60s; log follows:" >&2
            cat /tmp/caravel-ci.log >&2
            exit 1
          fi

      - name: Confirm the assistant is actually enabled
        # assist.spec.js skips itself when the capability is off. That is right
        # locally and wrong here: without this check, a typo in the env block
        # above would turn three tests into three silent skips and CI would
        # still be green.
        run: |
          set -euo pipefail
          curl -fsS -c /tmp/ci-cookies -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"demo","password":"demo1234"}' > /dev/null
          if ! curl -fsS -b /tmp/ci-cookies http://localhost:8080/api/auth/me | grep -q '"assist":true'; then
            echo "the server did not come up with the assistant enabled; assist.spec.js would skip" >&2
            exit 1
          fi
          echo "assistant enabled"

      - name: UI suite
        run: make test-ui

      # The report is the only way to see what a headless failure looked like.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
