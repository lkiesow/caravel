# How GitHub groups the automatically generated release notes (see
# .github/workflows/release.yml, which asks for them).
#
# These categories match on pull request *labels*, so they do nothing until
# changes arrive as labelled pull requests. Present now so that the first
# labelled PR is grouped correctly rather than the config being remembered
# later.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation, docs]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
