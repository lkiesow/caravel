# Dependabot version updates. Only the documentation site's Python pin for now
# (requirements.txt): it is the dependency that otherwise goes stale silently,
# since nothing else bumps it. Monthly, because the review is by hand -- see
# the checklist in requirements.txt.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: docs
