name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: JS syntax check
        run: scripts/check_js.sh

      - name: i18n key parity
        run: python3 scripts/check_i18n.py

      - name: Test
        run: go test ./...
