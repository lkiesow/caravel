<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caravel</title>
  <meta name="description" content="Self-hosted trip planning that keeps the map, the plan and the group in sync." />
  <!-- The brand navy, not the accent: this paints the OS-drawn chrome of an
       installed app, which should look like the icon tile it launched from.
       #2563eb stays the *in-app* accent (--color-accent) - see base.css. Keep
       this in step with theme_color in manifest.webmanifest. -->
  <meta name="theme-color" content="#23304f" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- The SVG favicon first: every current browser prefers it and stays sharp
       on a hidpi tab strip, and the PNGs remain for the ones that don't. All
       three come out of scripts/gen_icons.py. -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <!-- Social preview. The card is a committed PNG because scrapers reject SVG,
       and nothing here is per-trip: trips are not public, so one static card
       for the instance is the whole feature.

       The origin placeholder below is substituted per request by handleShell
       (see internal/httpapi/staticassets.go), because these URLs have to be
       absolute. Do not write the token itself in this comment: the
       substitution is a plain string replace and would rewrite it here too.

       The relative URLs this block used to carry were the reason a link
       previewed as nothing: Facebook, LinkedIn and Discord drop an image they
       cannot resolve on their own rather than resolving it against the page.
       The width and height matter for a different reason - without them
       Slack and X lay the card out as a small side thumbnail, ignoring the
       summary_large_image below. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Caravel" />
  <meta property="og:title" content="Caravel" />
  <meta property="og:description" content="Self-hosted trip planning that keeps the map, the plan and the group in sync." />
  <meta property="og:url" content="__CARAVEL_ORIGIN__/" />
  <meta property="og:image" content="__CARAVEL_ORIGIN__/brand/og-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Caravel - every trip, one place." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Caravel" />
  <meta name="twitter:description" content="Self-hosted trip planning that keeps the map, the plan and the group in sync." />
  <meta name="twitter:image" content="__CARAVEL_ORIGIN__/brand/og-card.png" />
  <!-- Preloaded rather than left to the CSS: the wordmark is in the first
       paint, and discovering the face only after base.css parses is a visible
       swap on every load. -->
  <link rel="preload" href="/fonts/montserrat-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/base.css" />
  <!-- Applied here, before the first paint, so a dark-themed app never flashes
       white while /js/app.js loads. web/js/theme.js owns the same rule and is
       the only place that writes the key; this is deliberately a duplicate of
       its resolve step, because a module import is too late to matter. -->
  <script>
    try {
      var pref = localStorage.getItem("caravel.theme");
      document.documentElement.dataset.theme =
        pref === "light" || pref === "dark"
          ? pref
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
    } catch (e) {
      /* Storage blocked: fall through to the OS preference at boot. */
    }
  </script>
</head>
<body>
  <div id="app">Caravel is starting up&hellip;</div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
