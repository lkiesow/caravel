name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: JS syntax check
        run: scripts/check_js.sh

      - name: i18n key parity
        run: python3 scripts/check_i18n.py

      - name: Test
        run: go test ./...

  # Separate job on purpose: this one installs a browser and starts a server, so
  # it is slower and has more ways to fail. Keeping it apart means a flaky browser
  # download can't mask a Go regression in the fast `ci` job above.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dev dependencies
        run: npm ci

      # Only Firefox: the suite runs one project, and downloading the other
      # engines would triple this step for nothing.
      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox

      - name: Start the server and seed the scenarios
        env:
          CARAVEL_DB_DSN: data/ci.db
          CARAVEL_WEB_DIR: web
        run: |
          set -euo pipefail
          mkdir -p data
          # Seed first: db.Open() runs the migrations, so this builds the schema
          # and creates the demo users the suite logs in as.
          go run ./cmd/seed
          # Build rather than `go run` so the background process is the server
          # itself, not a wrapper that compiles first.
          go build -o /tmp/caravel-ci ./cmd/caravel
          nohup /tmp/caravel-ci > /tmp/caravel-ci.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/api/health; then
              echo "server healthy after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "server did not become healthy within 60s; log follows:" >&2
            cat /tmp/caravel-ci.log >&2
            exit 1
          fi

      - name: UI suite
        run: make test-ui

      # The report is the only way to see what a headless failure looked like.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
